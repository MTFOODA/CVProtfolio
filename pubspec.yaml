name: cv_portfolio_maker
description: "CV & Portfolio Builder"
# The following line prevents the package from being accidentally published to
# pub.dev using `flutter pub publish`. This is preferred for private packages.
publish_to: 'none' # Remove this line if you wish to publish to pub.dev

# The following defines the version and build number for your application.
# A version number is three numbers separated by dots, like 1.2.43
# followed by an optional build number separated by a +.
# Both the version and the builder number may be overridden in flutter
# build by specifying --build-name and --build-number, respectively.
# In Android, build-name is used as versionName while build-number used as versionCode.
# Read more about Android versioning at https://developer.android.com/studio/publish/versioning
# In iOS, build-name is used as CFBundleShortVersionString while build-number is used as CFBundleVersion.
# Read more about iOS versioning at
# https://developer.apple.com/library/archive/documentation/General/Reference/InfoPlistKeyReference/Articles/CoreFoundationKeys.html
# In Windows, build-name is used as the major, minor, and patch parts
# of the product and file versions while build-number is used as the build suffix.
version: 1.0.4+5

environment:
  sdk: ^3.13.5

# Dependencies specify other packages that your package needs in order to work.
# To automatically upgrade your package dependencies to the latest versions
# consider running `flutter pub upgrade --major-versions`. Alternatively,
# dependencies can be manually updated by changing the version numbers below to
# the latest version available on pub.dev. To see which dependencies have newer
# versions available, run `flutter pub outdated`.
dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_web_plugins:
    sdk: flutter

  # The following adds the Cupertino Icons font to your application.
  # Use with the CupertinoIcons class for iOS style icons.
  cupertino_icons: ^1.0.8
  flutter_riverpod: ^3.4.3
  go_router: ^18.0.2
  supabase_flutter: ^2.18.2
  google_sign_in: ^7.2.0
  pdf: ^3.13.1
  printing: ^5.15.1
  archive: ^4.3.0
  # Reuses the version already resolved by pdf for DOCX image conversion.
  image: ^4.12.0
  # Used by `pdf` itself for the Unicode Bidi Algorithm (UAX #9) and Arabic
  # shaping. Declared directly so the exporters can call the same engine the
  # renderer relies on. Version pinned by `pdf`; no resolution change.
  bidi: ^2.0.13
  path_provider: ^2.1.6
  shared_preferences: ^2.5.6
  uuid: ^4.6.0
  intl: ^0.20.3
  url_launcher: ^6.3.3
  file_picker: ^13.1.0
  video_player: ^2.14.1
  # SHA-256 hashing for locally-stored portfolio access passwords. The Supabase
  # backend hashes server-side with pgcrypto instead; this is only used by the
  # on-device repository so local mode never stores plaintext.
  crypto: ^3.0.6
  share_plus: ^13.3.1
  local_auth: 3.0.2
  flutter_secure_storage: 11.2.0

dev_dependencies:
  integration_test:
    sdk: flutter
  video_player_platform_interface: ^6.9.0
  flutter_test:
    sdk: flutter

  # Generates the Android/iOS/Web/Windows launcher icons from the square brand
  # masters in `assets/branding/` (see `flutter_launcher_icons:` below and
  # `tools/create_identity.py` for how those masters are produced).
  flutter_launcher_icons: ^0.14.4

  # The "flutter_lints" package below contains a set of recommended lints to
  # encourage good coding practices. The lint set provided by the package is
  # activated in the `analysis_options.yaml` file located at the root of your
  # package. See that file for information about deactivating specific lint
  # rules and activating additional ones.
  flutter_lints: ^6.0.0

# For information on the generic Dart part of this file, see the
# following page: https://dart.dev/tools/pub/pubspec

# The following section is specific to Flutter packages.
flutter:

  # The following line ensures that the Material Icons font is
  # included with your application, so that you can use the icons in
  # the material Icons class.
  uses-material-design: true

  # To add assets to your application, add an assets section, like this:
  assets:
    - assets/config/public_app_config.json
    # Noto Naskh Arabic Regular (SIL OFL 1.1, ~212 KB) ships so Arabic documents
    # export on a device that has never been online. The licence and provenance
    # notes live beside it; `export_fonts.dart` loads the file explicitly via
    # its `bundledArabicFontAsset` constant (the asset key inside the bundle is
    # this path, which is why the `assets/` prefix is part of it).
    - assets/google_fonts/
    # Original gray/sky document-and-arrow identity from
    # `tools/create_identity.py`. Only the in-app logo is bundled; the
    # 1024 px icon masters are build-time inputs for `flutter_launcher_icons`
    # and would only add weight to the app.
    - assets/branding/app_logo.png

  # An image asset can refer to one or more resolution-specific "variants", see
  # https://flutter.dev/to/resolution-aware-images

  # For details regarding adding assets from package dependencies, see
  # https://flutter.dev/to/asset-from-package

  # To add custom fonts to your application, add a fonts section here,
  # in this "flutter" section. Each entry in this list should have a
  # "family" key with the font family name, and a "fonts" key with a
  # list giving the asset and other descriptors for the font. For
  # example:
  # fonts:
  #   - family: Schyler
  #     fonts:
  #       - asset: fonts/Schyler-Regular.ttf
  #       - asset: fonts/Schyler-Italic.ttf
  #         style: italic
  #   - family: Trajan Pro
  #     fonts:
  #       - asset: fonts/TrajanPro.ttf
  #       - asset: fonts/TrajanPro_Bold.ttf
  #         weight: 700
  #
  # For details regarding fonts from package dependencies,
  # see https://flutter.dev/to/font-from-package

  fonts:
    - family: tajawal
      fonts:
        - asset: assets/google_fonts/Tajawal-Regular.ttf
        - asset: assets/google_fonts/Tajawal-Medium.ttf
          weight: 500
        - asset: assets/google_fonts/Tajawal-Bold.ttf
          weight: 600
        - asset: assets/google_fonts/Tajawal-Bold.ttf
          weight: 700
    - family: inter
      fonts:
        - asset: assets/google_fonts/Inter-Regular.ttf
        - asset: assets/google_fonts/Inter-Variable.ttf
          weight: 500
        - asset: assets/google_fonts/Inter-Variable.ttf
          weight: 600
        - asset: assets/google_fonts/Inter-Bold.ttf
          weight: 700
    - family: lora
      fonts:
        - asset: assets/google_fonts/Lora-Regular.ttf
        - asset: assets/google_fonts/Lora-Bold.ttf
          weight: 700
    - family: roboto
      fonts:
        - asset: assets/google_fonts/Roboto-Regular.ttf
        - asset: assets/google_fonts/Roboto-Bold.ttf
          weight: 700
    - family: notoNaskhArabic
      fonts:
        - asset: assets/google_fonts/NotoNaskhArabic-Regular.ttf
    - family: CvContactIcons
      fonts:
        - asset: assets/google_fonts/ContactIcons-Regular.ttf
    - family: CvBrandIcons
      fonts:
        - asset: assets/google_fonts/ContactBrands-Regular.ttf

# Launcher icon generation: `dart run flutter_launcher_icons`.
#
# The masters are square 1024 px PNGs rendered from the approved CV monogram by
# `tools/create_identity.py`; the original banner is never modified.
# `app_icon.png` frames the emblem for legacy/rounded launchers, while
# `app_icon_foreground.png` keeps the emblem inside the 66% adaptive safe zone
# and fills the whole 108 dp layer so the launcher mask never reveals a seam.
# The foreground inset is 0 because that layer is already padded; the plugin's
# 16% default would shrink the artwork and expose the background plate.
#
# iOS is disabled because this project has no `ios/` platform folder; enabling
# it later only requires switching `ios` to true. Regenerate with:
#   python tools/create_identity.py
#   dart run flutter_launcher_icons
flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/branding/app_icon.png"
  adaptive_icon_background: "#2D333B"
  adaptive_icon_foreground: "assets/branding/app_icon_foreground.png"
  adaptive_icon_foreground_inset: 0
  min_sdk_android: 21
  web:
    generate: true
    image_path: "assets/branding/app_icon_web.png"
    background_color: "#F1F7FB"
    theme_color: "#343A40"
  windows:
    generate: true
    image_path: "assets/branding/app_icon.png"
    icon_size: 256
